<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera FitSense</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#eff6ff;background:#101d31;font:16px system-ui}main{padding:14px}button{font:inherit;color:inherit;background:#225479;border:1px solid #5984a2;border-radius:8px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.5}canvas{display:block;width:100%;max-height:380px;object-fit:contain;background:#080f19;border-radius:8px}p{margin:10px 0}.readings{display:grid;grid-template-columns:1fr 1fr;gap:5px}
</style>
<main>
<button id="start" disabled>Bật camera</button> <button id="stop" disabled>Tắt camera</button> <button id="mirror" aria-pressed="true">Chế độ gương</button>
<button id="voice" type="button" aria-pressed="false">🔊 Voice Coach</button>
<p id="status" role="status">Đang chuẩn bị camera…</p>
<video id="input" playsinline muted hidden></video><canvas id="view" width="640" height="360"></canvas>
<p id="fps">FPS: —</p><div class="readings" id="angles"></div>
<p id="voice-status" role="status">Bấm Voice Coach để bật giọng tiếng Việt.</p>
<output id="voice-cue"></output>
</main>
<script type="module" src="./webcam.mjs"></script>
</html>
