<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera FitSense</title>
<style>
*{box-sizing:border-box}[hidden]{display:none !important}body{margin:0;color:#eff6ff;background:#101d31;font:16px system-ui}main{padding:14px}button{font:inherit;color:inherit;background:#225479;border:1px solid #5984a2;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}#camera-toggle[aria-pressed="true"]{background:#b91c1c;border-color:#ef4444}canvas{display:block;width:100%;max-height:380px;object-fit:contain;background:#080f19;border-radius:8px}p{margin:10px 0}.readings{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#camera-device{max-width:100%;font:inherit;color:inherit;background:#225479;border:1px solid #5984a2;border-radius:8px;padding:6px}
</style>
<main>
<button id="camera-toggle" type="button" disabled aria-pressed="false">📷 Bật camera</button>
<button id="voice" type="button" aria-pressed="false"><span id="voice-icon" aria-hidden="true">🔇</span> Voice Coach</button>
<button id="voice-command" type="button" disabled aria-pressed="false" aria-describedby="command-status">🎙️ Khẩu lệnh</button>
<p id="command-status" role="status">Bấm Khẩu lệnh để bật micro.</p>
<output id="command-feedback"></output>
<p id="status" role="status">Đang chuẩn bị camera…</p>
<p><label for="camera-device">Camera</label>
<select id="camera-device" aria-describedby="camera-help" disabled><option value="">Mặc định của trình duyệt</option></select></p>
<p id="camera-help">Trình duyệt có thể chỉ hiện tên thiết bị sau khi bạn cấp quyền. Tắt camera trước khi đổi thiết bị.</p>
<video id="input" playsinline muted hidden></video><canvas id="view" width="640" height="360"></canvas>
<p id="fps">FPS: —</p><div class="readings" id="angles"></div>
<p id="voice-status" role="status">Bấm Voice Coach để bật giọng tiếng Việt.</p>
<output id="voice-cue"></output>
</main>
<script type="module" src="./webcam.mjs"></script>
</html>
