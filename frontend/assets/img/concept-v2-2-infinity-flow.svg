<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <!-- Left Loop Gradient: Pastel Pink on outer loop fading into Pure White at the center crossover -->
    <linearGradient id="pinkCenterGrad" gradientUnits="userSpaceOnUse" x1="65" y1="260" x2="258" y2="260">
